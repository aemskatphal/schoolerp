name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger (FTP)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate production database.php from secrets
        shell: bash
        env:
          DB_HOSTNAME: ${{ secrets.DB_HOSTNAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
        run: |
          python3 - <<'PYEOF'
          template = """<?php
          defined('BASEPATH') OR exit('No direct script access allowed');

          $active_group = 'default';
          $query_builder = TRUE;

          $db['default'] = array(
              'dsn'    => '',
              'hostname' => '__DB_HOSTNAME__',
              'username' => '__DB_USERNAME__',
              'password' => '__DB_PASSWORD__',
              'database' => '__DB_DATABASE__',
              'dbdriver' => 'mysqli',
              'dbprefix' => '',
              'pconnect' => FALSE,
              'db_debug' => FALSE,
              'cache_on' => FALSE,
              'cachedir' => '',
              'char_set' => 'utf8',
              'dbcollat' => 'utf8_general_ci',
              'swap_pre' => '',
              'encrypt' => FALSE,
              'compress' => FALSE,
              'stricton' => FALSE,
              'failover' => array(),
              'save_queries' => FALSE
          );
          """
          import os
          for key in ('DB_HOSTNAME', 'DB_USERNAME', 'DB_PASSWORD', 'DB_DATABASE'):
              template = template.replace('__' + key + '__', os.environ[key])
          with open('application/config/database.php', 'w') as f:
              f.write(template)
          print('database.php generated from secrets')
          PYEOF

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          dangerous-clean-slate: false
          timeout: 3600000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/installation/**
            **/sql/**
            **/dist/**
            **/Reference code for system/**
            **/application/logs/**
            **/application/cache/**
            **/*.log
